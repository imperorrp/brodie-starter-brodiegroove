<!doctype html>
<!-- Transparent 9:16 title overlays that clips.py lays over footage (rendered with ?alpha=1). Kept in the top safe area. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../brand.css">
<style>
  html, body { background: transparent; }
  .poster::before, .poster::after { display: none; }
  .poster { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .poster.s9x16 { justify-content: flex-start !important; padding-top: 13cqh !important; }
  .eyebrow { justify-content: center; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
  h1 { font-size: calc(var(--u) * 10); margin-top: calc(var(--u) * 1.6); line-height: .95;
    text-shadow: 0 calc(var(--u) * .5) 0 rgba(0,0,0,.85), 0 0 calc(var(--u) * 5) rgba(0,0,0,.75); }
  h1 .outline { text-shadow: 0 0 calc(var(--u) * 4) rgba(0,0,0,.9); }
  .pill { font-family: var(--display); font-weight: normal; font-size: calc(var(--u) * 4.4); margin-top: calc(var(--u) * 3); padding: calc(var(--u) * 1.2) calc(var(--u) * 3.6); }
</style></head>
<body><div class="poster">
  <div data-slide="d3"><div class="eyebrow">How Brodie scores you</div><h1 class="display">Real scores.<br><span class="outline">Not vibes.</span></h1></div>
  <div data-slide="d4h"><h1 class="display">Same miss.<br><span class="v">Three Brodies.</span></h1><span class="pill pink">HYPE</span></div>
  <div data-slide="d4c"><h1 class="display">Same miss.<br><span class="v">Three Brodies.</span></h1><span class="pill cyan">CHILL</span></div>
  <div data-slide="d4k"><h1 class="display">Same miss.<br><span class="v">Three Brodies.</span></h1><span class="pill">COACH</span></div>
  <div data-slide="d5"><div class="eyebrow">4 friends · 1 camera</div><h1 class="display">Squad up.<br><span class="pk">Get tagged.</span></h1></div>
  <div data-slide="d6"><div class="eyebrow">#BeatMyBrodie</div><h1 class="display">Which grade<br>are <span class="v">you?</span></h1></div>
  <div data-slide="d7"><div class="eyebrow">Week one</div><h1 class="display">Week one<br>on the <span class="v">line.</span></h1></div>
</div>
<script src="../config.js"></script><script src="../promo.js"></script>
</body></html>
