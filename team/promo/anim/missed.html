<!doctype html>
<!-- "Missed calls from Brodie": the clingy-coach running gag. A lock screen fills with Brodie's notifications one by one,
     then holds (8 s; the still is the last frame). One a day: v1 Fri 10/16, v2 Sat 10/17, v3 Sun 10/18 (the dates on screen). ?v=1 skipped practice, 2 doomscrolling at 2:47 AM, 3 the streak.
     A meme, not a feature: Brodie doesn't send notifications. python -m team.promo.animate missed -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../brand.css"><link rel="stylesheet" href="anim.css">
<style>
  .poster { display: flex; flex-direction: column; align-items: center; padding: 6cqh 7cqw 6cqh; }
  .bg .blob.a { opacity: .22; } .bg .blob.b { opacity: .14; }
  .meme { font: calc(var(--u) * 6.2) / 1.02 var(--display); text-transform: uppercase; text-align: center; letter-spacing: -.01em; max-width: 92%; }
  .meme em { font-style: normal; color: var(--volt); }
  .clock { margin-top: calc(var(--u) * 5); text-align: center; }
  .clock .d { font: 600 calc(var(--u) * 3.2) var(--grotesk); color: rgba(244,244,240,.8); }
  .clock .t { font: 300 calc(var(--u) * 20) / 1 var(--body); letter-spacing: -.03em; color: var(--paper); }
  .stack { position: relative; width: 100%; margin-top: calc(var(--u) * 4); display: flex; flex-direction: column; }
  /* each card's slot grows from nothing as it lands, so the older ones slide down under it (lock-screen style) */
  .nw { display: grid; grid-template-rows: 1fr; padding-bottom: var(--gap); animation: grow 8s cubic-bezier(.2,.9,.25,1) both; --gap: calc(var(--u) * 1.6); }
  .nw > .n { min-height: 0; }
  @keyframes grow { 0% { grid-template-rows: 0fr; padding-bottom: 0; } 4%, 100% { grid-template-rows: 1fr; padding-bottom: var(--gap); } }
  .n { display: flex; gap: calc(var(--u) * 2.2); align-items: center; padding: calc(var(--u) * 2) calc(var(--u) * 2.4); border-radius: calc(var(--u) * 3.6);
    background: rgba(40,41,46,.78); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 calc(var(--u) * 1.5) calc(var(--u) * 4) rgba(0,0,0,.45);
    overflow: hidden; animation: drop 8s cubic-bezier(.2,.9,.25,1.15) both; animation-delay: inherit; }
  .n img { width: calc(var(--u) * 8.2); height: calc(var(--u) * 8.2); border-radius: calc(var(--u) * 2); flex: none; object-fit: cover; }
  .n .tx { flex: 1; min-width: 0; text-align: left; }
  .n .top { display: flex; justify-content: space-between; font: 700 calc(var(--u) * 2.9) var(--grotesk); color: var(--paper); }
  .n .top span { font-weight: 500; color: rgba(244,244,240,.55); font-size: .9em; }
  .n .body { font: 500 calc(var(--u) * 2.9) / 1.3 var(--body); color: rgba(244,244,240,.88); margin-top: calc(var(--u) * .3); }
  .n.call .body { color: var(--red); font-weight: 700; }
  .n.call .body::before { content: '📞 '; }
  @keyframes drop { 0% { opacity: 0; translate: 0 calc(var(--u) * -6); scale: .96; } 4% { opacity: 1; translate: 0 0; scale: 1; } 100% { opacity: 1; translate: 0 0; scale: 1; } }
  .cta2 { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.4); animation: ctain 8s ease-out both; }
  .cta2 .pill { font-size: calc(var(--u) * 3.4); }
  .cta2 .l { font: 600 calc(var(--u) * 2.8) var(--grotesk); color: var(--mut); }
  @keyframes ctain { 0%, 74% { opacity: 0; translate: 0 calc(var(--u) * 3); } 80%, 100% { opacity: 1; translate: 0 0; } }

  html .poster.s9x16 { justify-content: flex-start !important; }   /* the clock stays put while the stack grows */
  .s9x16 .meme { font-size: calc(var(--u) * 6.6); }
  .s9x16 .clock .t { font-size: calc(var(--u) * 19); }
  .s4x5 { padding-top: 5cqh; }
  .s4x5 .meme { font-size: calc(var(--u) * 5.4); }
  .s4x5 .clock { margin-top: calc(var(--u) * 2.5); }
  .s4x5 .clock .t { font-size: calc(var(--u) * 13); }
  .s4x5 .stack { margin-top: calc(var(--u) * 2.5); }
  .s4x5 .nw { --gap: calc(var(--u) * 1.2); }
  .s4x5 .n { padding: calc(var(--u) * 1.5) calc(var(--u) * 2.2); }
  .s4x5 .n img { width: calc(var(--u) * 6.6); height: calc(var(--u) * 6.6); }
  .s4x5 .n .top, .s4x5 .n .body { font-size: calc(var(--u) * 2.5); }
</style></head>
<body><div class="poster">
  <div class="bg"><i class="blob a"></i><i class="blob b"></i><i class="blob c"></i></div>

  <div class="meme" data-v="1">Me after skipping <em>one</em> day of dance practice:</div>
  <div class="meme" data-v="2">POV: you said <em>"one more scroll"</em> 3 hours ago</div>
  <div class="meme" data-v="3">Your dance coach when your <em>streak</em> ends at midnight:</div>

  <div class="clock"><div class="d" data-v="1">Friday, October 16</div><div class="d" data-v="2">Saturday, October 17</div><div class="d" data-v="3">Sunday, October 18</div>
    <div class="t" data-v="1">11:58</div><div class="t" data-v="2">2:47</div><div class="t" data-v="3">11:59</div></div>

  <div class="stack" id="stack">
    <template data-v="1">call|Missed FaceTime Video
      |you good? 👀
      |count 4 is still waiting for you
      |5, 6, 7, 8… hello??
      |your hips miss me
      |not mad. hands up when you're ready 🙌
      call|Missed FaceTime Video (12)</template>
    <template data-v="2">|it's 2:47. we could be doing ONE 8-count
      call|Missed FaceTime Video
      |you watched 40 dance videos tonight. now DO one
      |the ghost is literally one beat ahead. you can't get lost
      |fine. HYPE mode. I'll yell nicely
      call|Missed FaceTime Video (37)</template>
    <template data-v="3">|your streak ends at midnight 🔥
      call|Missed FaceTime Video
      |Beat Assassin doesn't earn itself
      |your friend just beat your ghost. just saying
      |I saved you a PERFECT. come get it
      call|Missed FaceTime Video (3)</template>
  </div>

  <div class="cta2"><span class="pill">Call him back 📞</span><span class="l" data-line="FaceTime">@brodiegroove · #BeatMyBrodie</span></div>
</div>
<script>
  // newest on top, like a lock screen; card i drops in at 0.7 s + 0.85 s * i and the stack shifts down under it
  const tpl = document.querySelector(`template[data-v="${new URLSearchParams(location.search).get('v') || '1'}"]`);
  if (tpl) {
    const rows = tpl.innerHTML.trim().split('\n').map(s => s.trim()).filter(Boolean).map(s => s.split('|'));
    const stack = document.getElementById('stack');
    const ago = i => { const m = (rows.length - 1 - i) * 3; return m ? `${m}m ago` : 'now'; };
    rows.forEach(([kind, body], i) => {
      const el = document.createElement('div');
      el.className = 'nw'; el.style.animationDelay = (0.7 + 0.85 * i) + 's';
      el.innerHTML = `<div class="n${kind === 'call' ? ' call' : ''}"><img src="../../../data/tmp/promo/anim/art/brodie-pfp-square.png"><div class="tx"><div class="top">Brodie 🕺<span>${ago(i)}</span></div>` +
        `<div class="body"></div></div></div>`;
      el.querySelector('.body').textContent = body;
      stack.prepend(el);
    });
  }
</script>
<script src="../config.js"></script><script src="anim.js"></script>
</body></html>
